name: release

# Push a version tag (git tag v1.13.0 && git push origin v1.13.0) and this publishes a GitHub release whose notes
# are that version's CHANGELOG.md section. It refuses a tag that does not match VERSION or has no notes.
# Re-running it for an existing release updates the notes instead of failing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write   # create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against VERSION
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$tag" ]; then
            echo "::error::Tag $tag does not match VERSION ($version) - bump VERSION and CHANGELOG.md first"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: python3 tools/release_notes.py "$VERSION" > "$RUNNER_TEMP/notes.md" && cat "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
