name: release

# Publishes a GitHub release whose notes are that version's CHANGELOG.md section, in either of two ways:
#   - push a version tag:   git tag v1.13.1 && git push origin v1.13.1
#   - or run this workflow (Actions -> release -> Run workflow, on main): it creates the vX.Y.Z tag on the commit it
#     runs on, from VERSION, so no tag push is needed
# It refuses a version that does not match VERSION or has no CHANGELOG notes, and never moves an existing tag.
# Re-running it for an existing release updates the notes instead of failing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must equal VERSION on the chosen branch), e.g. 1.13.1"
        required: true
        type: string

permissions:
  contents: write   # create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the version against VERSION
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            wanted="${INPUT_VERSION#v}"
            if ! printf '%s' "$wanted" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$INPUT_VERSION' is not a version (X.Y.Z)"; exit 1
            fi
          else
            wanted="${GITHUB_REF_NAME#v}"
          fi
          if [ "$wanted" != "$version" ]; then
            echo "::error::Version $wanted does not match VERSION ($version) - bump VERSION and CHANGELOG.md first"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: python3 tools/release_notes.py "$VERSION" > "$RUNNER_TEMP/notes.md" && cat "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # never move an existing tag: it must already point at this commit, or not exist yet
            # an annotated tag's commit is on its "^{}" line, which sorts after the tag line itself
            existing="$(git ls-remote --tags origin | awk -v t="refs/tags/$TAG" '$2 == t || $2 == t"^{}"' | sort -k2 | tail -n1 | cut -f1)"
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already exists on another commit ($existing) - not moving it"; exit 1
            fi
            gh release create "$TAG" --target "$GITHUB_SHA" --latest --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --latest --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
