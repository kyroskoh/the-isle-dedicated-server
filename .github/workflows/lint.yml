name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x linux/*.sh
      - name: Python syntax
        run: python3 -m py_compile tools/isle_rcon.py
      - name: Render config with a fake server
        run: |
          set -e
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/srv/TheIsle/Binaries/Linux"
          printf '#!/bin/sh\ntrap "exit 0" TERM\nwhile :; do sleep 1; done\n' > "$tmp/srv/TheIsle/Binaries/Linux/TheIsleServer-Linux-Shipping"
          chmod +x "$tmp/srv/TheIsle/Binaries/Linux/TheIsleServer-Linux-Shipping"
          sed -e "s|^SERVER_DIR=|SERVER_DIR=$tmp/srv|" -e "s|^BACKUP_DIR=|BACKUP_DIR=$tmp/bk|" \
              -e 's|^UPDATE_ON_START=true|UPDATE_ON_START=false|' -e 's|^SAVE_BEFORE_STOP=true|SAVE_BEFORE_STOP=false|' \
              -e 's|^RCON_PASSWORD=|RCON_PASSWORD=ci-test-password|' \
              config/server.conf.example > "$tmp/server.conf"
          export ISLE_CONF="$tmp/server.conf" ISLE_NO_SYSTEMD=1
          linux/isle-server.sh version | grep -q "$(cat VERSION)"
          linux/isle-server.sh check
          # negative test: an invalid port must be rejected (PRD CFG-05)
          sed 's|^GAME_PORT=.*|GAME_PORT=99999|' "$tmp/server.conf" > "$tmp/bad.conf"
          if ISLE_CONF="$tmp/bad.conf" linux/isle-server.sh check; then echo "check accepted a bad port"; exit 1; fi
          linux/isle-server.sh configure
          grep -q '^\[/Script/TheIsle.TIGameSession\]' "$tmp/srv/TheIsle/Saved/Config/LinuxServer/Game.ini"
          grep -q '^DedicatedServerClientId=' "$tmp/srv/TheIsle/Saved/Config/LinuxServer/Engine.ini"
          linux/isle-server.sh start
          linux/isle-server.sh status
          # update must refuse while running (PRD UPD-03)
          if linux/isle-server.sh update; then echo "update ran while server was running"; exit 1; fi
          linux/isle-server.sh stop
          linux/isle-server.sh backup
          ls "$tmp/bk"/theisle-*.tar.gz

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < docker/Dockerfile
      - name: ShellCheck container scripts
        run: shellcheck -x docker/entrypoint.sh docker/isle-server
      - name: Validate compose file
        run: docker compose config -q
      - name: Build image
        run: docker build -f docker/Dockerfile -t theisle-server:ci .
      - name: Image size under 500 MB (DKR-01)
        run: |
          size=$(docker image inspect theisle-server:ci --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((500 * 1024 * 1024))
      - name: Smoke test with a fake server binary
        run: |
          set -eux
          docker volume create isle-ci
          # Fake server: logs its uid, exits cleanly on SIGTERM.
          docker run --rm --entrypoint bash -v isle-ci:/data theisle-server:ci -c '
            mkdir -p /data/server/TheIsle/Binaries/Linux
            printf "%s\n" "#!/bin/bash" "echo FAKE uid=\$(id -u)" "trap \"echo FAKE got TERM; exit 0\" TERM" "while :; do sleep 1; done" \
              > /data/server/TheIsle/Binaries/Linux/TheIsleServer-Linux-Shipping
            chmod +x /data/server/TheIsle/Binaries/Linux/TheIsleServer-Linux-Shipping'
          run() { docker run -d --name isle-ci -v isle-ci:/data -e UPDATE_ON_START=false -e PUID=1234 -e PGID=1234 \
                    --health-interval=2s --health-start-period=5s "$@" theisle-server:ci; }

          # DKR-03: env override reaches Game.ini; RCON password generated
          run -e SERVER_NAME="CI Server"
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' isle-ci)" = healthy ] && break; sleep 2; done
          docker logs isle-ci
          test "$(docker inspect -f '{{.State.Health.Status}}' isle-ci)" = healthy                      # DKR-06
          docker exec isle-ci grep -q '^ServerName=CI Server$' /data/server/TheIsle/Saved/Config/LinuxServer/Game.ini
          docker exec isle-ci grep -qE '^RconPassword=.{24}$' /data/server/TheIsle/Saved/Config/LinuxServer/Game.ini
          docker logs isle-ci 2>&1 | grep -q 'FAKE uid=1234'                                              # DKR-04
          docker exec isle-ci isle-server status                                                          # DKR-07
          docker exec isle-ci isle-server backup
          docker exec isle-ci sh -c 'ls /data/backups/theisle-*.tar.gz'                                   # DKR-09

          # DKR-05: graceful stop
          docker stop -t 90 isle-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' isle-ci)" = 0
          docker logs isle-ci 2>&1 | grep -q 'FAKE got TERM'
          docker rm isle-ci

          # DKR-02: a new container keeps the config
          run
          sleep 8
          docker exec isle-ci grep -q '^ServerName=CI Server$' /data/server/TheIsle/Saved/Config/LinuxServer/Game.ini
          docker rm -f isle-ci

          # CFG-05 in Docker: a bad env value makes the container fail
          if docker run --rm -v isle-ci:/data -e UPDATE_ON_START=false -e GAME_PORT=99999 theisle-server:ci; then
            echo "container accepted GAME_PORT=99999"; exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($failed) { exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path windows -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Render config with a fake server (5.1)
        shell: powershell
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'isle'
          $conf = Join-Path $tmp 'server.conf'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          (Get-Content config\server.conf.example) `
            -replace '^SERVER_DIR=$', "SERVER_DIR=$tmp\srv" `
            -replace '^BACKUP_DIR=$', "BACKUP_DIR=$tmp\bk" `
            -replace '^RCON_PASSWORD=$', 'RCON_PASSWORD=ci-test-password' | Set-Content $conf
          .\windows\IsleServer.ps1 Version
          .\windows\IsleServer.ps1 Check -ConfigPath $conf
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # negative test: an invalid port must be rejected (PRD CFG-05)
          $bad = Join-Path $tmp 'bad.conf'
          (Get-Content $conf) -replace '^GAME_PORT=.*$', 'GAME_PORT=99999' | Set-Content $bad
          .\windows\IsleServer.ps1 Check -ConfigPath $bad
          if ($LASTEXITCODE -ne 1) { Write-Host 'Check accepted a bad port'; exit 1 }
          .\windows\IsleServer.ps1 Configure -ConfigPath $conf
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path "$tmp\srv\TheIsle\Saved\Config\WindowsServer\Game.ini" -Pattern 'TIGameSession' -Quiet)) { exit 1 }
          .\windows\IsleServer.ps1 Info -ConfigPath $conf
          .\windows\IsleServer.ps1 Backup -ConfigPath $conf
          if (-not (Get-ChildItem "$tmp\bk\theisle-*.zip")) { exit 1 }
