; Example config/overrides/Game.ini - copy to config/overrides/Game.ini and edit.
;
; Lines here are merged into the generated Game.ini:
;  * a Key=Value replaces EVERY generated line of that key in that section
;    (repeat the key for lists),
;  * new keys and new sections are appended,
;  * lines starting with +, -, ! are passed through unchanged (UE array syntax),
;  * ; and # start comments.
; The file is read on every start (native and Docker).

[/Script/TheIsle.TIGameSession]
; Region spawning (community-documented keys)
;bUseRegionSpawning=true
;bUseRegionSpawnCooldown=true
;RegionSpawnCooldownTimeSeconds=300

; Weather change interval in seconds (community-documented)
;MinWeatherVariationInterval=600
;MaxWeatherVariationInterval=1200

; Replace the generated roster with exactly these classes
;AllowedClasses=Tyrannosaurus
;AllowedClasses=Triceratops
